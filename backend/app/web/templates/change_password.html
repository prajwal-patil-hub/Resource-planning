{% import "_auth_page.html" as auth %}
{{ auth.page("Choose a password", "Whoever set your last one knows it. Pick your own.") }}
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form class="auth-form" method="post" action="/change-password">
    <label class="fld">
      <span>New password <em>(at least 10 characters)</em></span>
      <input type="password" name="password" autocomplete="new-password" required minlength="10" autofocus />
    </label>
    <label class="fld">
      <span>Again</span>
      <input type="password" name="confirm" autocomplete="new-password" required />
    </label>
    <button class="btn btn-primary" type="submit">Save and continue</button>
    <p class="fld-note">Any other sessions you have will be signed out.</p>
  </form>
{{ auth.endpage() }}
